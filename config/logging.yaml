version: 1
disable_existing_loggers: false
formatters:
  table:
    (): core.observability.logger.ConsoleTableFormatter
filters:
  quiet_access:
    (): core.observability.logger.ConsoleAccessFilter
handlers:
  console:
    class: logging.StreamHandler
    formatter: table
    filters: [quiet_access]
    stream: ext://sys.stderr
root:
  level: INFO
  handlers: [console]
loggers:
  uvicorn:
    handlers: []
    propagate: true
  uvicorn.error:
    handlers: []
    propagate: true
  uvicorn.access:
    handlers: []
    propagate: true
