version: 1
disable_existing_loggers: false
formatters:
  table:
    (): core.observability.logger.TSVFormatter
handlers:
  console:
    class: core.observability.logger.TSVStreamHandler
    formatter: table
    stream: ext://sys.stderr
root:
  level: INFO
  handlers: [console]
loggers:
  uvicorn:
    handlers: []
    propagate: true
  uvicorn.error:
    handlers: []
    propagate: true
  uvicorn.access:
    handlers: []
    propagate: true
