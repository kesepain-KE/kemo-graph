name: CI

on:
  # 任意分支的推送都跑一次，包括 kemo-preview 这类开发分支。
  # 不写 branches 过滤等价于匹配全部分支。
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.10"；两端各取一个版本守住上下限兼容性。
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Regression benchmarks load the pinned original implementation from Git.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q core api provider markitdown update start.py start_web.py

      - name: 架构边界检查
        run: python tools/check_architecture.py

      - name: 单元测试
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test -- --run

      - name: 生产构建
        run: npm run build
